name: QWIZ / inventory only game data migration scope
on:
  push:
    branches: [isolation/qwiz-independent-supabase-20261030]
    paths:
      - 'next/isolation/source-data-scope-readonly.sql'
      - '.github/workflows/qwiz-data-scope-readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Source catalog estimates only, no personal data
        env:
          GOS_SOURCE_DB_URL: ${{ secrets.GOS_SOURCE_DB_URL }}
          PGSSLMODE: require
          PGCONNECT_TIMEOUT: '8'
        shell: bash
        run: |
          set -euo pipefail
          : "${GOS_SOURCE_DB_URL:?Missing GOS source restricted secret}"
          python3 - <<'PY'
          from os import environ
          from urllib.parse import urlsplit,unquote
          u=urlsplit(environ['GOS_SOURCE_DB_URL'])
          if (unquote(u.username or '')!='qwiz_catalog_reader.bderfrcfuhnutuoyudje'
              or not (u.hostname or '').endswith('.pooler.supabase.com')
              or u.port != 5432):
              raise SystemExit('Unexpected source role/project')
          PY
          psql "$GOS_SOURCE_DB_URL" -X --no-psqlrc --no-password -A -q \
            -v ON_ERROR_STOP=1 -f next/isolation/source-data-scope-readonly.sql
          echo 'Inventory computed from PostgreSQL catalogs only; zero QWIZ rows read.' >> "$GITHUB_STEP_SUMMARY"
