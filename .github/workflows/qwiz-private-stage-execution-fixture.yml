name: QWIZ / disposable private staging SQL execution fixture
on:
  push:
    branches: [isolation/qwiz-independent-supabase-20261030]
    paths:
      - '.github/workflows/qwiz-private-stage-execution-fixture.yml'
      - 'next/isolation/build-private-qwiz-row-stage.py'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: one-time-fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: one-time-fixture
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Create synthetic 57-table QWIZ fixture and validate private staging restrictions
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          psql -X -q -v ON_ERROR_STOP=1 -c 'CREATE SCHEMA auth; CREATE TABLE auth.users(id uuid); CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN;'
          python3 - "$work" <<'PY'
          import pathlib,sys
          d=pathlib.Path(sys.argv[1])
          names=[f"qwiz_fixture_{i:02d}" for i in range(57)]
          (d/"tables.txt").write_text("\n".join(names)+"\n")
          (d/"fixture.sql").write_text("\n".join(f"CREATE TABLE public.{n}(id integer NOT NULL);" for n in names))
          (d/"dump.sql").write_text("\n".join(f"INSERT INTO public.{n} (id) VALUES (1);" for n in names))
          PY
          psql -X -q -v ON_ERROR_STOP=1 -f "$work/fixture.sql"
          python3 next/isolation/build-private-qwiz-row-stage.py \
            "$work/dump.sql" "$work/tables.txt" "$work/staging.sql"
          psql -X -q -v ON_ERROR_STOP=1 -f "$work/staging.sql"
          n="$(psql -XAtq -v ON_ERROR_STOP=1 -c "select count(*) from pg_tables where schemaname='qwiz_transfer_stage'")"
          test "$n" = 57
          rolecheck="$(psql -XAtq -v ON_ERROR_STOP=1 -c "select has_schema_privilege('anon','qwiz_transfer_stage','USAGE')::int,has_schema_privilege('authenticated','qwiz_transfer_stage','USAGE')::int,has_schema_privilege('service_role','qwiz_transfer_stage','USAGE')::int")"
          test "$rolecheck" = "0|0|0"
          rows="$(psql -XAtq -v ON_ERROR_STOP=1 -c "select count(*) from qwiz_transfer_stage.qwiz_fixture_01")"
          test "$rows" = 1
          echo 'PASS: 57 staged synthetic records across 57 tables, RLS enabled and zero API role schema access.'
