name: QWIZ-PARTY / PWA offline QA
on:
  push:
    paths:
      - 'next/sw.js'
      - 'next/pwa.js'
      - 'next/manifest.webmanifest'
      - 'next/pwa-icon.svg'
      - 'next/pwa.test.mjs'
      - 'next/pwa-browser.spec.mjs'
      - 'next/index.html'
      - 'next/workspace.html'
      - 'next/presenter.html'
      - 'next/profile.html'
      - '.github/workflows/pwa-qa.yml'
  workflow_dispatch:
jobs:
  offline-shell:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check PWA assets and isolation
        run: |
          node --check next/sw.js
          node --check next/pwa.js
          node --test next/pwa.test.mjs
      - name: Check manifest and cached resources exist
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          root=Path('next')
          src=(root/'sw.js').read_text()
          entries=re.search(r"const SHELL=\[(.*?)\];",src,re.S).group(1)
          for name in re.findall(r"'([^']+)'",entries):
              resolved=(root/name).resolve()
              assert (root/'index.html').is_file() if name=='./' else resolved.is_file(), f'Missing offline shell resource: {name}'
          print('Validated static resources and manifest:',json.loads((root/'manifest.webmanifest').read_text())['name'])
          PY
      - name: Test offline reload in Chromium
        run: |
          npm install --no-save @playwright/test@1.56.1
          npx playwright install chromium --with-deps
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/qwiz-pwa-http.log 2>&1 &
          npx playwright test next/pwa-browser.spec.mjs --reporter=list --workers=1
