name: QWIZ-PARTY / Builder card QA
on:
  push:
    paths:
      - 'next/workspace.css'
      - 'next/workspace.js'
      - 'next/builder-cards.spec.mjs'
      - 'next/workspace.html'
      - 'next/visual.spec.mjs'
      - '.github/workflows/saved-build-layout-qa.yml'
  pull_request:
    paths:
      - 'next/workspace.css'
      - 'next/workspace.js'
      - 'next/builder-cards.spec.mjs'
      - 'next/workspace.html'
      - 'next/visual.spec.mjs'
      - '.github/workflows/saved-build-layout-qa.yml'
  workflow_dispatch:
concurrency:
  group: saved-build-cards-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save @playwright/test@1.56.1
          npx playwright install chromium --with-deps
      - name: Test saved game cards at desktop, tablet and mobile widths
        run: |
          mkdir -p visual-artifacts
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/saved-builds-http.log 2>&1 &
          npx playwright test next/visual.spec.mjs next/builder-cards.spec.mjs --grep "Saved build cards keep identical width and height|General timing settings keep summary-duration input aligned|Selecting a card controls insertion order|Two separate taps on a card|New geography and arcade cards|Cards remain square|Mechanics expand by default|QWIZ favicon loads" --reporter=list --workers=1
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saved-build-layout-screenshots
          path: visual-artifacts/saved-builds-uniform-*.png
          if-no-files-found: ignore
