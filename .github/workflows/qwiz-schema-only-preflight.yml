name: QWIZ / source schema-only candidate preflight (never exports data)
on:
  push:
    branches: [isolation/qwiz-independent-supabase-20261030]
    paths:
      - 'next/isolation/select-pgdump-toc.py'
      - '.github/workflows/qwiz-schema-only-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  schema-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check single least-privilege source secret
        id: config
        shell: bash
        env:
          GOS_SOURCE_DB_URL: ${{ secrets.GOS_SOURCE_DB_URL }}
        run: |
          if [[ -n "$GOS_SOURCE_DB_URL" ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'BLOCKED: source URI secret missing; schema dump was not attempted.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Acquire source public SCHEMA ONLY without reading any rows
        if: steps.config.outputs.configured == 'true'
        shell: bash
        env:
          GOS_SOURCE_DB_URL: ${{ secrets.GOS_SOURCE_DB_URL }}
          PGSSLMODE: require
          PGCONNECT_TIMEOUT: '8'
        run: |
          set -euo pipefail
          umask 077
          tmp="$RUNNER_TEMP/qwiz-schema-closure"
          mkdir -p "$tmp"
          trap 'rm -rf "$tmp"' EXIT
          python3 - <<'PY'
          from os import environ
          from urllib.parse import urlsplit,unquote
          u=urlsplit(environ['GOS_SOURCE_DB_URL'])
          if (u.scheme not in ('postgres','postgresql')
              or not (u.hostname or '').endswith('.pooler.supabase.com')
              or u.port!=5432
              or unquote(u.username or '')!='qwiz_catalog_reader.bderfrcfuhnutuoyudje'
              or not u.password):
              raise SystemExit('Refusing non-reader/incorrect source project URI')
          PY
          echo 'Source role and project verified; fetching SCHEMA ONLY into temporary ephemeral workspace.'
          docker run --rm --network host --user "$(id -u):$(id -g)" \
            -e GOS_SOURCE_DB_URL -e PGSSLMODE -e PGCONNECT_TIMEOUT \
            -v "$tmp:/work" postgres:17 sh -ec \
            'pg_dump --dbname="$GOS_SOURCE_DB_URL" --schema=public --schema-only --format=custom --no-owner --no-acl --file=/work/public-schema.dump'
          docker run --rm --user "$(id -u):$(id -g)" -v "$tmp:/work" postgres:17 \
            pg_restore --list /work/public-schema.dump > "$tmp/full.toc"
          python3 next/isolation/select-pgdump-toc.py --input "$tmp/full.toc" --output "$tmp/qwiz-selected.toc"
          docker run --rm --user "$(id -u):$(id -g)" -v "$tmp:/work" postgres:17 \
            pg_restore --schema-only --no-owner --no-acl \
              --use-list=/work/qwiz-selected.toc --file=/work/qwiz-schema-candidate.sql /work/public-schema.dump
          test -s "$tmp/qwiz-schema-candidate.sql"
          echo 'SCHEMA_ONLY_CANDIDATE: generated in ephemeral private runner; not uploaded, not applied, will be deleted.'
          echo 'Schema candidate selected and discarded locally; no data rows, Auth accounts or GOS source modifications.' >> "$GITHUB_STEP_SUMMARY"
      - name: Mark missing connection as unverified
        if: steps.config.outputs.configured != 'true'
        run: echo "::warning::No source schema was extracted; missing encrypted Actions secret."
