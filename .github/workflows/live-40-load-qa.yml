name: QWIZ-PARTY / Real Supabase 40-client load test
on:
  push:
    paths:
      - 'next/live-40-supabase.mjs'
      - '.github/workflows/live-40-load-qa.yml'
  workflow_dispatch:
concurrency:
  group: qwiz-real-40-${{ github.ref }}
  cancel-in-progress: false
jobs:
  forty-real-clients:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
    env:
      QWIZ_LOAD_ROOM: A40C2626
      QWIZ_LOAD_TAG: qwiz_perf_40_20261026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install lightweight Supabase SDK
        run: npm install --no-save @supabase/supabase-js@2
      - name: Forty concurrent public screen requests (live Supabase)
        env:
          QWIZ_LOAD_MODE: public
        run: node next/live-40-supabase.mjs
      - name: Forty real anonymous phone identities, joins and answers
        env:
          QWIZ_LOAD_MODE: full
        run: node next/live-40-supabase.mjs
