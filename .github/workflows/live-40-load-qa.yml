name: QWIZ-PARTY / Real Supabase 40-client load test
on:
  # Deliberately opt-in: creates disposable anonymous test users and performs
  # 120 real RPC reads. Never run on ordinary commits.
  workflow_dispatch:
    inputs:
      test_room:
        description: 'Code of an isolated QWIZ LOAD 40 fixture (8 hex digits)'
        required: true
        type: string
concurrency:
  group: qwiz-real-40-${{ github.ref }}
  cancel-in-progress: false
jobs:
  forty-real-clients:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
    env:
      QWIZ_LOAD_ROOM: ${{ inputs.test_room }}
      QWIZ_LOAD_TAG: qwiz_perf_40_20261026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install lightweight Supabase SDK
        run: npm install --no-save @supabase/supabase-js@2
      - name: Forty concurrent public screen requests (live Supabase)
        env:
          QWIZ_LOAD_MODE: public
        run: node next/live-40-supabase.mjs
      - name: Forty real anonymous phone identities, joins and answers
        env:
          QWIZ_LOAD_MODE: full
        run: node next/live-40-supabase.mjs
