name: ORG Quiz v2 / QA
on:
  push:
    branches:
      - 'rebuild/**'
  pull_request:
    paths:
      - 'next/**'
      - '.github/workflows/next-qa.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate new app
        run: node --test next/test.mjs next/arcade-20261025.spec.mjs next/flags-six.test.cjs
      - name: Validate new PostgreSQL migration syntax (no production writes)
        run: |
          python -m pip install --quiet pglast
          python - <<'PY'
          from pathlib import Path
          from pglast import parse_sql
          for name in ('20261025_shuffle_all_presented_answers.sql','20261025_memory_runner_teamtap.sql','20261026_unified_lobby_and_captains.sql'):
              path=Path('next/migrations')/name
              parse_sql(path.read_text(encoding='utf-8'))
              print('Parsed:',path)
          PY
      - name: Static asset checks
        run: |
          test -s next/index.html
          test -s next/app.js
          test -s next/app.css
          test -s next/migration.sql
          ! grep -q 'studio-2026.css' next/index.html
