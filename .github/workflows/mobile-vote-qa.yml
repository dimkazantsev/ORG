name: QWIZ-PARTY / Mobile vote QA
on:
  push:
    paths:
      - 'next/app.js'
      - 'next/arcade.js'
      - 'next/player-layout.css'
      - 'next/player-layout.spec.mjs'
      - '.github/workflows/mobile-vote-qa.yml'
  pull_request:
    paths:
      - 'next/app.js'
      - 'next/arcade.js'
      - 'next/player-layout.css'
      - 'next/player-layout.spec.mjs'
      - '.github/workflows/mobile-vote-qa.yml'
  workflow_dispatch:
concurrency:
  group: qwiz-mobile-vote-${{ github.ref }}
  cancel-in-progress: true
jobs:
  boost-vote:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save @playwright/test@1.56.1
          npx playwright install chromium --with-deps
      - name: Validate visible and clickable bonus choices on phones
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/qwiz-mobile-qa.log 2>&1 &
          npx playwright test next/player-layout.spec.mjs --grep "Finished arcade boost ballot|Two-stage penalty vote|Lobby play emblem" --reporter=list --workers=1
