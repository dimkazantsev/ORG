name: QWIZ / legacy GOS read-only source preflight
on:
  push:
    branches: [isolation/qwiz-independent-supabase-20261030]
    paths:
      - 'next/isolation/verify-two-databases-readonly.sh'
      - '.github/workflows/qwiz-dual-db-readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate script syntax without accessing databases
        run: bash -n next/isolation/verify-two-databases-readonly.sh
      - name: Confirm private source connection is configured
        id: check
        shell: bash
        env:
          SOURCE: ${{ secrets.GOS_SOURCE_DB_URL }}
        run: |
          if [[ -z "$SOURCE" ]]; then
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'BLOCKED: GOS_SOURCE_DB_URL is not configured in repository Actions secrets; NO source database read happened.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'configured=true' >> "$GITHUB_OUTPUT"
            echo 'Source DB credential is present; proceeding to SELECT-only catalog checks.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Query GOS source and optional QWIZ target metadata
        if: steps.check.outputs.configured == 'true'
        shell: bash
        env:
          GOS_SOURCE_DB_URL: ${{ secrets.GOS_SOURCE_DB_URL }}
          QWIZ_TARGET_DB_URL: ${{ secrets.QWIZ_TARGET_DB_URL }}
        run: |
          bash next/isolation/verify-two-databases-readonly.sh
          echo 'SOURCE_DATABASE_VERIFIED: yes; no migration or modifications executed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Mark source verification unproven when connection absent
        if: steps.check.outputs.configured != 'true'
        run: echo "::warning title=Source not verified::Add a restricted GOS_SOURCE_DB_URL Actions secret to run live read-only verification. Workflow success here means only shell syntax validated."
