name: QWIZ / verify BOTH Supabase DB URLs read-only
on:
  push:
    branches: [isolation/qwiz-independent-supabase-20261030]
    paths:
      - 'next/isolation/verify-two-databases-readonly.sh'
      - '.github/workflows/qwiz-dual-db-readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate script syntax without accessing databases
        run: bash -n next/isolation/verify-two-databases-readonly.sh
      - name: Confirm private source connection is configured
        id: check
        shell: bash
        env:
          SOURCE: ${{ secrets.GOS_SOURCE_DB_URL }}
          TARGET: ${{ secrets.QWIZ_TARGET_DB_URL }}
        run: |
          if [[ -z "$SOURCE" || -z "$TARGET" ]]; then
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'BLOCKED: both source and target Actions secrets must be configured; no database queries executed.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'configured=true' >> "$GITHUB_OUTPUT"
            echo 'Both source and target credentials are configured; proceeding to SELECT-only catalog checks.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Verify GOS source AND QWIZ Free target via SELECT-only SQL
        if: steps.check.outputs.configured == 'true'
        shell: bash
        env:
          GOS_SOURCE_DB_URL: ${{ secrets.GOS_SOURCE_DB_URL }}
          QWIZ_TARGET_DB_URL: ${{ secrets.QWIZ_TARGET_DB_URL }}
        run: |
          bash next/isolation/verify-two-databases-readonly.sh
          echo 'BOTH_DATABASES_VERIFIED: yes; no migration or modifications executed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Mark verification unproven if either encrypted connection is absent
        if: steps.check.outputs.configured != 'true'
        run: echo "::warning title=Source not verified::Both GOS_SOURCE_DB_URL and QWIZ_TARGET_DB_URL must exist for live read-only verification."
