name: Deploy independent QWIZ-PARTY to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate independent QWIZ-PARTY
        shell: bash
        run: |
          set -euo pipefail
          node --test next/test.mjs
          for js in next/app.js next/workspace.js next/presenter.js next/profile.js next/stage.js next/arcade.js next/russia-geo.js; do
            node --check "$js"
          done
          test -s index.html
          test -s favicon.svg
          test -s next/index.html
          test -s next/workspace.html
          test -s next/presenter.html
          test -s next/profile.html
          test -s next/sw.js
          test -s next/manifest.webmanifest
          test -s next/assets/manrope-variable.ttf
          test -s next/vendor/qrcode.min.js
          grep -Fq "new URL('./next/', url)" index.html
          ! grep -Fq "./legacy/" index.html
          for js in next/app.js next/workspace.js next/presenter.js next/profile.js; do
            grep -Fq 'https://vwsoergltegncrretxnz.supabase.co' "$js"
            ! grep -Fq 'https://bderfrcfuhnutuoyudje.supabase.co' "$js"
          done

      - name: Package only the new QWIZ-PARTY
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/next
          cp index.html favicon.svg _site/
          find next -maxdepth 1 -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' -o -name '*.svg' -o -name '*.json' -o -name '*.webmanifest' \) -exec cp -t _site/next/ {} +
          cp -a next/assets next/vendor _site/next/
          test ! -e _site/legacy
          test ! -e _site/app.js
          test ! -e _site/styles.css
          test -s _site/next/app.js
          test -s _site/next/index.html
          ! grep -Fq 'bderfrcfuhnutuoyudje.supabase.co' _site/next/app.js
          echo 'Pages artifact includes new QWIZ only; no old ORG game.'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload independent game
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify publication and retirement of old game
        shell: bash
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          site="${PAGES_URL%/}"
          for attempt in $(seq 1 12); do
            if curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "$site/index.html?release=$GITHUB_SHA-$attempt" -o /tmp/qwiz-root.html &&
               curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "$site/next/index.html?release=$GITHUB_SHA-$attempt" -o /tmp/qwiz-next.html &&
               curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "$site/next/app.js?release=$GITHUB_SHA-$attempt" -o /tmp/qwiz-new-app.js &&
               grep -Fq "new URL('./next/', url)" /tmp/qwiz-root.html &&
               grep -Fq 'https://vwsoergltegncrretxnz.supabase.co' /tmp/qwiz-new-app.js &&
               ! grep -Fq './legacy/' /tmp/qwiz-root.html; then
              legacy_status="$(curl -sSL -o /dev/null -w '%{http_code}' "$site/legacy/" || true)"
              legacy_js_status="$(curl -sSL -o /dev/null -w '%{http_code}' "$site/app.js" || true)"
              if [[ "$legacy_status" == 404 && "$legacy_js_status" == 404 ]]; then
                echo "Published only independent QWIZ-PARTY; old /legacy/ and /app.js return HTTP 404."
                exit 0
              fi
              echo "Legacy cache or Pages propagation: /legacy/=$legacy_status /app.js=$legacy_js_status"
            fi
            sleep 5
          done
          echo 'Could not verify removal of old game from GitHub Pages.'
          exit 1
