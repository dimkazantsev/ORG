name: Deploy ORG Quiz to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate rebuilt studio UI and application
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          test -s studio-2026.css
          test -s ui-ux-pro-max.css
          node --test next/test.mjs
          test -s next/presenter.html
          test -s next/presenter.css
          test -s next/presenter.js
          test -s next/vendor/qrcode.min.js
          test -s next/workspace.html
          test -s next/workspace.js
          test -s next/workspace.css
          test -s next/profile.html
          test -s next/profile.js
          test -s next/profile.css
          test -s next/assets/animals.svg
          test -s next/theme.css
          test -s next/motion.css
          test -s next/assets/manrope-variable.ttf
          test -s next/migrations/qwiz_advance_variable_collision_fix.sql
          node --check next/workspace.js
          node --check next/profile.js
          node --check next/stage.js
          node --check next/teams.js
          node --check next/workspace-teams.js
          test -s next/teams.css
          test -s next/stage.css
          test -s next/assets/habitats.svg
          test -s next/migrations/20261022_question_stage.sql
          node --check next/presenter.js
          node --check next/load-check.mjs
          test -s next/migrations/qwiz_rich_scoring.sql
          test -s next/migrations/qwiz_never_leak_rich_solutions.sql
          grep -q 'class="studio-rebuild"' index.html
          grep -q 'studio-2026.css?v=20261022-4' index.html
          grep -q 'ui-ux-pro-max.css?v=20261022-6' index.html
          grep -q -- '--q-blue' ui-ux-pro-max.css
          grep -q -- '--studio-radius' studio-2026.css
          grep -q 'id="teacherView"' index.html
          grep -q 'id="studentView"' index.html
          grep -q 'id="questionBank"' index.html
          grep -q 'id="answerOptions"' index.html
          grep -q 'id="homeAccess"' index.html
          grep -q 'id="heroHost"' index.html
          grep -q 'class="studio-flowbar"' index.html
          grep -q '<svg viewBox="0 0 24 24"' index.html
          grep -q 'fill:none!important' studio-2026.css
          ! grep -q 'theme-modern.css' index.html
          ! grep -q 'theme-light.css' index.html
          echo "Rebuilt UI and existing game anchors verified"
      
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Validate published build
        shell: bash
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          site="${PAGES_URL%/}"
          echo "Checking GitHub Pages at $site"
          for attempt in $(seq 1 12); do
            if curl -fsSL --connect-timeout 10 --max-time 20 -H 'Cache-Control: no-cache' "$site/index.html?release=20261022-7-$GITHUB_RUN_ID-$attempt" -o /tmp/org-published.html &&
               grep -q 'data-build="20261022.7"' /tmp/org-published.html &&
               curl -fsSL --connect-timeout 10 --max-time 20 "$site/app.js?v=20261022-motion1" -o /tmp/org-published.js &&
               grep -q 'org_quiz_archive_history' /tmp/org-published.js &&
               curl -fsSL --connect-timeout 10 --max-time 20 "$site/studio-2026.css?v=20261022-4" -o /tmp/org-published-studio.css &&
               grep -q -- '--studio-radius' /tmp/org-published-studio.css &&
               curl -fsSL --connect-timeout 10 --max-time 20 "$site/ui-ux-pro-max.css?v=20261022-6" -o /tmp/org-published-uipromax.css &&
               grep -q -- '--q-blue' /tmp/org-published-uipromax.css &&
               curl -fsSL --connect-timeout 10 --max-time 20 "$site/next/index.html?release=$GITHUB_RUN_ID" -o /tmp/org-next-index.html &&
               grep -q 'QWIZ-PARTY — командный квиз' /tmp/org-next-index.html &&
               curl -fsSL --connect-timeout 10 --max-time 20 "$site/next/app.js?v=13" -o /tmp/org-next-app.js &&
               grep -q 'org_next_answer' /tmp/org-next-app.js &&
               curl -fsSL --connect-timeout 10 --max-time 20 "$site/next/motion.css?v=2" -o /tmp/qwiz-motion.css &&
               grep -q 'qwiz-enter' /tmp/qwiz-motion.css &&
               curl -fsSL --connect-timeout 10 --max-time 20 "$site/next/app.css?v=7" -o /tmp/org-next-style.css &&
               grep -q -- '--mint' /tmp/org-next-style.css &&
               curl -fsSL --connect-timeout 10 --max-time 20 "$site/next/presenter.html" -o /tmp/org-next-presenter.html &&
               grep -q 'QWIZ-PARTY — экран аудитории' /tmp/org-next-presenter.html &&
               curl -fsSL --connect-timeout 10 --max-time 20 "$site/next/workspace.html" -o /tmp/qwiz-workspace.html &&
               grep -q 'Сборки и раунды' /tmp/qwiz-workspace.html &&
               curl -fsSL --connect-timeout 10 --max-time 20 "$site/next/profile.html" -o /tmp/qwiz-profile.html &&
               grep -q 'Мой профиль' /tmp/qwiz-profile.html &&
               curl -fsSL --connect-timeout 10 --max-time 20 "$site/next/workspace.js?v=6" -o /tmp/qwiz-workspace.js &&
               grep -q 'qwiz_launch_build' /tmp/qwiz-workspace.js &&
               curl -fsSL --connect-timeout 10 --max-time 20 "$site/next/stage.js?v=1" -o /tmp/qwiz-stage.js &&
               grep -q 'hydrateIllustrations' /tmp/qwiz-stage.js &&
               curl -fsSL --connect-timeout 10 --max-time 20 "$site/next/stage.css?v=1" -o /tmp/qwiz-stage.css &&
               grep -q 'frame-drift' /tmp/qwiz-stage.css &&
               curl -fsSL --connect-timeout 10 --max-time 20 "$site/next/presenter.js?v=8" -o /tmp/qwiz-presenter.js &&
               grep -q 'questionScene' /tmp/qwiz-presenter.js &&
               curl -fsSL --connect-timeout 10 --max-time 20 "$site/next/assets/habitats.svg" -o /tmp/qwiz-habitats.svg &&
               grep -q 'id="mangrove"' /tmp/qwiz-habitats.svg &&
               curl -fsSL --connect-timeout 10 --max-time 20 "$site/next/assets/animals.svg" -o /tmp/qwiz-animals.svg &&
               grep -q 'id="fox"' /tmp/qwiz-animals.svg; then
              echo "Published QWIZ-PARTY HTML, JS, CSS and projection display verified."
              exit 0
            fi
            echo "Published assets are not updated (attempt $attempt)"
            sleep 5
          done
          echo 'Published build could not be verified after deployment.'
          exit 1

