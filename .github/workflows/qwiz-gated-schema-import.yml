name: QWIZ / gated schema-only import into isolated Free project
on:
  push:
    branches: [isolation/qwiz-independent-supabase-20261030]
    paths:
      - 'next/isolation/SCHEMA-IMPORT-GATE.md'
      - '.github/workflows/qwiz-gated-schema-import.yml'
permissions:
  contents: read
jobs:
  schema-import:
    # A normal push, CI, PR update, or secret configuration CANNOT import a schema.
    # Only the exact, intentionally authored approval commit message arms the job.
    if: "${{ github.event.head_commit.message == 'QWIZ_FREE_SCHEMA_ONLY_IMPORT_APPROVED' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate both projects, generate manifest privately, import ONLY to empty Free QWIZ
        shell: bash
        env:
          GOS_SOURCE_DB_URL: ${{ secrets.GOS_SOURCE_DB_URL }}
          QWIZ_TARGET_DB_URL: ${{ secrets.QWIZ_TARGET_DB_URL }}
          PGSSLMODE: require
          PGCONNECT_TIMEOUT: '8'
        run: |
          set -euo pipefail
          umask 077
          : "${GOS_SOURCE_DB_URL:?Source catalog reader secret missing}"
          : "${QWIZ_TARGET_DB_URL:?QWIZ Free destination postgres secret missing}"
          # Verify that both independent database credentials work without
          # altering either source or target. The target URI may include raw
          # special password characters; use the safe PGPASSWORD adapter.
          python3 next/isolation/safe-session-pooler.py --connection GOS_SOURCE_DB_URL --mode probe
          python3 next/isolation/safe-session-pooler.py --connection QWIZ_TARGET_DB_URL --mode probe
          temp="$(mktemp -d "$RUNNER_TEMP/qwiz-schema-import.XXXXXXXX")"
          trap 'rm -rf "$temp"' EXIT
          echo 'Read-only source catalog fetch from old GOS.ID...'
          psql "$GOS_SOURCE_DB_URL" -X --no-psqlrc --no-password -qAt \
            -v ON_ERROR_STOP=1 -f next/isolation/source-schema-catalog-private.sql > "$temp/public.json"
          psql "$GOS_SOURCE_DB_URL" -X --no-psqlrc --no-password -qAt \
            -v ON_ERROR_STOP=1 -f next/isolation/source-quiz-private-catalog.sql > "$temp/private.json"
          python3 next/isolation/check-private-schema-manifest.py "$temp/public.json"
          python3 next/isolation/build-guarded-target-schema.py "$temp/public.json" "$temp/private.json" "$temp/import.sql"
          # CRITICAL: no source string reaches target, only locally generated schema DDL.
          unset GOS_SOURCE_DB_URL
          echo 'Performing guarded schema-only import in a single target transaction.'
          if ! python3 next/isolation/safe-session-pooler.py \
               --connection QWIZ_TARGET_DB_URL --mode apply-schema \
               --schema-file "$temp/import.sql"; then
            echo 'SCHEMA IMPORT FAILED / target transaction rolled back. Check target project privately; SQL bodies and secrets not printed.'
            exit 1
          fi
          echo 'PASS: schema-only bundle applied in isolated QWIZ Free. No Auth users or game rows imported, and production QWIZ frontend not switched.'
          echo 'QWIZ schema-only transaction imported. User data, Auth identities, Storage and 40-player validation still required before any production cutover.' >> "$GITHUB_STEP_SUMMARY"
