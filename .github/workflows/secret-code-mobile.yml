name: QWIZ-PARTY / Secret Code mobile and bonus modal QA
on:
  push:
    paths:
      - 'next/arcade.js'
      - 'next/arcade.css'
      - 'next/player-layout.css'
      - 'next/secret-code.js'
      - 'next/arcade-qa-fixture.html'
      - 'next/secret-code-mobile.spec.mjs'
      - '.github/workflows/secret-code-mobile.yml'
  pull_request:
    paths:
      - 'next/arcade.js'
      - 'next/arcade.css'
      - 'next/player-layout.css'
      - 'next/secret-code.js'
      - 'next/arcade-qa-fixture.html'
      - 'next/secret-code-mobile.spec.mjs'
      - '.github/workflows/secret-code-mobile.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check next/arcade.js
          node --check next/secret-code.js
          npm install --no-save @playwright/test@1.56.1
          npx playwright install chromium --with-deps
      - name: Verify Secret Code and bonus ballot on phones
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/secret-code-browser.log 2>&1 &
          npx playwright test next/secret-code-mobile.spec.mjs --workers=1 --reporter=list
