name: QWIZ-PARTY / Mobile answer layout QA
on:
  push:
    paths:
      - 'next/player-layout.*'
      - 'next/app.css'
      - 'next/app.js'
      - '.github/workflows/player-layout-qa.yml'
  pull_request:
    paths:
      - 'next/player-layout.*'
      - 'next/app.css'
      - 'next/app.js'
      - '.github/workflows/player-layout-qa.yml'
  workflow_dispatch:
concurrency:
  group: player-layout-${{ github.ref }}
  cancel-in-progress: true
jobs:
  layout:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium browser runner
        run: |
          npm install --no-save @playwright/test@1.56.1
          npx playwright install chromium --with-deps
      - name: Test older flags and long answers without mobile overlap
        run: |
          mkdir -p visual-artifacts
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/qwiz-player-server.log 2>&1 &
          npx playwright test next/player-layout.spec.mjs --grep "Older flag formats and long answer labels remain entirely visible|Personal round totals stay horizontal on narrow phones|Answer confirmation remains at bottom without resizing choice buttons or header|No sending or acceptance popup appears above mobile answer cards" --reporter=list --workers=1
