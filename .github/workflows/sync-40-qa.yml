name: QWIZ-PARTY / 40-player synchronization QA
on:
  push:
    paths:
      - 'next/app.js'
      - 'next/arcade.js'
      - 'next/presenter.js'
      - 'next/workspace.js'
      - 'next/index.html'
      - 'next/presenter.html'
      - 'next/workspace.html'
      - 'next/sync-reliability.test.mjs'
      - 'next/sync-40-browser.spec.mjs'
      - 'next/migrations/20261026_idempotent_arcade_tap_batches.sql'
      - '.github/workflows/sync-40-qa.yml'
  workflow_dispatch:
concurrency:
  group: qwiz-sync40-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reliability:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source, retry and idempotency invariants
        run: node --test next/sync-reliability.test.mjs
      - name: Check SQL patch syntax (no writes to production)
        run: |
          python3 -m pip install --quiet pglast
          python3 - <<'PY'
          from pathlib import Path
          from pglast import parse_sql
          f=Path('next/migrations/20261026_idempotent_arcade_tap_batches.sql')
          parse_sql(f.read_text(encoding='utf-8'))
          print('Parsed:',f)
          PY
      - name: Install browser test dependencies
        run: |
          npm install --no-save @playwright/test@1.56.1
          npx playwright install chromium --with-deps
      - name: 40 simulated clients and interrupted-answer recovery
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/qwiz-sync40-http.log 2>&1 &
          npx playwright test next/sync-40-browser.spec.mjs --reporter=list --workers=1
