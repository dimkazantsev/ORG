name: QWIZ / scoped GOS data read readiness and source-vs-target seed hashes
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Aggregate-only read of original QWIZ game rows (requires approved temporary grant)
        env:
          GOS_SOURCE_DB_URL: ${{ secrets.GOS_SOURCE_DB_URL }}
          PGSSLMODE: require
          PGCONNECT_TIMEOUT: '8'
        shell: bash
        run: |
          set -euo pipefail
          : "${GOS_SOURCE_DB_URL:?Source restricted secret missing}"
          python3 - <<'PY'
          from urllib.parse import urlsplit, unquote
          from os import environ
          u=urlsplit(environ['GOS_SOURCE_DB_URL'])
          if (unquote(u.username or '')!='qwiz_catalog_reader.bderfrcfuhnutuoyudje'
              or not (u.hostname or '').endswith('.pooler.supabase.com')
              or u.port != 5432):
              raise SystemExit('Unexpected GOS project or restricted role')
          PY
          psql "$GOS_SOURCE_DB_URL" -X --no-psqlrc --no-password \
            -v ON_ERROR_STOP=1 -qAt -f next/isolation/source-qwiz-data-readiness-private.sql
          echo 'PASS: 57 scoped permissions and temporary policies checked; only aggregate counts/digests displayed.' >> "$GITHUB_STEP_SUMMARY"
