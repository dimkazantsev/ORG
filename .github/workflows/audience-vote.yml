name: QWIZ-PARTY / Audience bonus vote scene
on:
  push:
    paths:
      - 'next/arcade.js'
      - 'next/arcade.css'
      - 'next/arcade-qa-fixture.html'
      - 'next/audience-vote.spec.mjs'
      - '.github/workflows/audience-vote.yml'
  pull_request:
    paths:
      - 'next/arcade.js'
      - 'next/arcade.css'
      - 'next/arcade-qa-fixture.html'
      - 'next/audience-vote.spec.mjs'
      - '.github/workflows/audience-vote.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          node --check next/arcade.js
          npm install --no-save @playwright/test@1.56.1
          npx playwright install chromium --with-deps
      - name: Verify audience voting presentation
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/qwiz-audience-vote.log 2>&1 &
          npx playwright test next/audience-vote.spec.mjs --workers=1 --reporter=list
