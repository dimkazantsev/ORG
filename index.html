<title>QWIZ-PARTY — интеллектуальные игры</title>
<meta name="description" content="Главный вход в независимый QWIZ-PARTY.">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<script data-org-canonical-entry>
(function () {
  // The new QWIZ uses the separate /next/ assets and database.
  // Preserve old invites with ?legacy=1 and pass room query parameters through.
  var url = new URL(window.location.href);
  var legacy = url.searchParams.get('legacy') === '1';
  url.searchParams.delete('legacy');
  var target = new URL(legacy ? './legacy/' : './next/', url);
  target.search = url.search;
  target.hash = url.hash;
  window.location.replace(target.href);
})();
</script>
<noscript><meta http-equiv="refresh" content="0;url=./next/"></noscript>
