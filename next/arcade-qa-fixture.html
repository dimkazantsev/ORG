<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="./theme.css"><link rel="stylesheet" href="./arcade.css?v=secret-code-live-20261028-1"><link rel="stylesheet" href="./player-layout.css?v=secret-mobile-vote-20261030-1">
<style>body{margin:0;background:#faf9fd;font-family:system-ui,sans-serif}main{max-width:900px;margin:0 auto;padding:16px;box-sizing:border-box}html.fixture-player #gameView #gameContent{height:calc(100dvh - 90px);min-height:0;overflow:hidden;box-sizing:border-box}html.fixture-player main{padding:8px}html.fixture-projection main{max-width:none;padding:8px;height:100dvh}html.fixture-projection #gameView{display:none}html.fixture-projection #projectionMain{display:flex!important;width:100%;height:calc(100dvh - 16px);min-height:0;box-sizing:border-box}</style>
<script defer src="./arcade.js?v=secret-code-live-20261028-1"></script><script defer src="./secret-code.js?v=secret-code-live-20261028-1"></script>
</head><body><main><div id="gameView"><div id="gameContent" class="game-card"><div id="test-root"></div></div></div><div id="projectionMain" hidden></div></main>
<script>
const fake={mode:'captain',running:true,card_position:1,started_at:new Date(Date.now()-4000).toISOString(),ends_at:new Date(Date.now()+60000).toISOString(),server_now:new Date().toISOString(),teams:[{id:'team1',name:'Команда первая',points:0,taps:0,place:1}],mine:{team_id:'team1',player_id:'player1',captain:true,credits:0,achievements:[]},awards:[],extra:{}};
const accepted=[];
const batches=new Set();
window.mountExample=(mode,withVote=false,longCode=false)=>{
 QwizArcade.stop('player');
 fake.mode=mode;fake.running=true;fake.card_position+=1;fake.vote=withVote?{can_vote:true,open:true,stage:'strategy',strategy:null,counts:{},my_choice:null,winner_team:'team1',target_name:'Команда 2',vote_ends_at:new Date(Date.now()+25000).toISOString()}:null;
 fake.secret_code=mode==='sequence_memory'?{phase:'answer',template:'Четыре цвета',level:1,length:4,choices:['red','blue','yellow','green'],answer_count:0,submitted:false}:null;
 if(longCode&&fake.secret_code)fake.secret_code={...fake.secret_code,length:10,choices:['red','blue','yellow','green','star','shield','crown','key']};
 fake.extra=mode==='captain'?{captain:true,tiles:Array.from({length:12},(_,index)=>({index,icon:null,matched:false,open:false})),pairs:0,moves:0,players:[{team_id:'team1',pairs:0,moves:0,completed_ms:null}]}:
 mode==='rocket'?{selected:true,alive:true,cleared:0,next_at:new Date(Date.now()+1600).toISOString(),players:[{team_id:'team1',cleared:0}]}:{};
 const client={rpc:async(method,params)=>{
  if(method==='qwiz_party_arcade')return {data:{...fake,server_now:new Date().toISOString()},error:null};
  if(method==='qwiz_vote_boost'){accepted.push({action:'boost-vote',choice:params.p_choice});fake.vote={...fake.vote,my_choice:params.p_choice};return {data:{ok:true},error:null};}
  if(method==='qwiz_secret_code_state')return {data:fake.secret_code,error:null};
  if(method==='qwiz_secret_code_submit'){
   accepted.push({action:'secret-submit',answer:params.p_answer});
   fake.secret_code={...fake.secret_code,submitted:true};
   return {data:{ok:true},error:null};
  }
  if(method==='qwiz_arcade_play'){accepted.push({action:params.p_action,tile:params.p_tile});if(params.p_action==='flip'){const tile=fake.extra.tiles[params.p_tile];tile.icon='🌈';tile.open=true;}return {data:{ok:true},error:null};}
  if(method==='qwiz_arcade_tap_once'){
   if(!batches.has(params.p_batch)){
    batches.add(params.p_batch);
    accepted.push({action:'tap',count:params.p_count,batch:params.p_batch});
    fake.teams[0].taps+=params.p_count;
   }
   return {data:{ok:true,duplicate:batches.has(params.p_batch)},error:null};
  }
  if(method==='qwiz_arcade_action'){accepted.push({action:params.p_action,count:params.p_count});fake.teams[0].taps+=params.p_count;return {data:{ok:true},error:null};}
  return {data:{ok:true},error:null};
 }};
 const root=document.getElementById('test-root');
 QwizArcade.mountPlayer(root,{phase:'intermission',code:'1A2B3C4D',room_id:'room-id',activity:{settings:{arcade_mode:mode}}},{client});
};

window.mountProjectionVote=(stage='strategy',strategy=null)=>{
  QwizArcade.stop('screen');
  document.documentElement.classList.add('fixture-projection');
  const now=Date.now();
  fake.mode='tug';fake.card_position+=1;fake.running=false;
  fake.teams=[{id:'team1',name:'Команда победителей',points:24,place:1},{id:'team2',name:'Команда соперников',points:12,place:2}];
  fake.vote={open:true,can_vote:false,stage,strategy,winner_team:'team1',
   target_name:'Команда соперников',team_members:4,counts:stage==='strategy'?{support:4,sabotage:0}:{headstart:2,teamwork:1,momentum:1},
   vote_ends_at:new Date(now+10000).toISOString(),full_vote_ends_at:new Date(now+22000).toISOString()};
  const client={rpc:async method=>{
   if(method==='qwiz_party_arcade')return {data:{...fake,server_now:new Date().toISOString()},error:null};
   return {data:{ok:true},error:null};
  }};
  QwizArcade.mountProjector(document.getElementById('projectionMain'),
   {phase:'intermission',code:'1A2B3C4D',activity:{settings:{arcade_mode:'tug'}}},client);
};
window.updateProjectionVote=(stage,strategy,counts)=>{
  fake.vote={...fake.vote,stage,strategy,counts};
  fake.vote.vote_ends_at=new Date(Date.now()+9000).toISOString();
  window.dispatchEvent(new Event('online'));
};
window.accepted=accepted;
window.setFixturePlayer=()=>document.documentElement.classList.add('player-compact','fixture-player');
window.setFixtureVote=()=>{fake.vote={can_vote:true,open:true,stage:'strategy',strategy:null,counts:{},my_choice:null,winner_team:'team1',target_name:'Команда 2',vote_ends_at:new Date(Date.now()+25000).toISOString()};};
</script></body></html>
