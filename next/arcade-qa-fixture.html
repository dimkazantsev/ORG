<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="./theme.css"><link rel="stylesheet" href="./arcade.css?v=memory-runner-teamtap-20261025">
<style>body{margin:0;background:#faf9fd;font-family:system-ui,sans-serif}main{max-width:900px;margin:0 auto;padding:16px;box-sizing:border-box}</style>
<script defer src="./arcade.js?v=memory-runner-teamtap-20261025"></script>
</head><body><main id="test-root"></main>
<script>
const fake={mode:'captain',running:true,card_position:1,started_at:new Date(Date.now()-4000).toISOString(),ends_at:new Date(Date.now()+60000).toISOString(),server_now:new Date().toISOString(),teams:[{id:'team1',name:'Команда первая',points:0,taps:0,place:1}],mine:{team_id:'team1',player_id:'player1',captain:true,credits:0,achievements:[]},awards:[],extra:{}};
const accepted=[];
const batches=new Set();
window.mountExample=mode=>{
 QwizArcade.stop('player');
 fake.mode=mode;fake.running=true;fake.card_position+=1;
 fake.extra=mode==='captain'?{captain:true,tiles:Array.from({length:12},(_,index)=>({index,icon:null,matched:false,open:false})),pairs:0,moves:0,players:[{team_id:'team1',pairs:0,moves:0,completed_ms:null}]}:
 mode==='rocket'?{selected:true,alive:true,cleared:0,next_at:new Date(Date.now()+1600).toISOString(),players:[{team_id:'team1',cleared:0}]}:{};
 const client={rpc:async(method,params)=>{
  if(method==='qwiz_party_arcade')return {data:{...fake,server_now:new Date().toISOString()},error:null};
  if(method==='qwiz_arcade_play'){accepted.push({action:params.p_action,tile:params.p_tile});if(params.p_action==='flip'){const tile=fake.extra.tiles[params.p_tile];tile.icon='🌈';tile.open=true;}return {data:{ok:true},error:null};}
  if(method==='qwiz_arcade_tap_once'){
   if(!batches.has(params.p_batch)){
    batches.add(params.p_batch);
    accepted.push({action:'tap',count:params.p_count,batch:params.p_batch});
    fake.teams[0].taps+=params.p_count;
   }
   return {data:{ok:true,duplicate:batches.has(params.p_batch)},error:null};
  }
  if(method==='qwiz_arcade_action'){accepted.push({action:params.p_action,count:params.p_count});fake.teams[0].taps+=params.p_count;return {data:{ok:true},error:null};}
  return {data:{ok:true},error:null};
 }};
 const root=document.getElementById('test-root');
 QwizArcade.mountPlayer(root,{phase:'intermission',code:'1A2B3C4D',room_id:'room-id',activity:{settings:{arcade_mode:mode}}},{client});
};
window.accepted=accepted;
</script></body></html>
